<style>
  :root { --bg:#0b0d14; --card:#12141d; --border:#1e2030; --text:#c8cdd9; --muted:#6b7280; --accent:#3b82f6; --accent2:#22c55e; --accent3:#f59e0b; --danger:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.5; }
  .container { max-width:1200px; margin:0 auto; padding:24px 16px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  header h1 { font-size:22px; font-weight:600; letter-spacing:-0.3px; }
  header .meta { font-size:12px; color:var(--muted); }
  .refresh-btn { background:var(--card); border:1px solid var(--border); color:var(--text); padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
  .refresh-btn:hover { border-color:var(--accent); }
  .refresh-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .hero { display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; margin-bottom:24px; }
  .hero-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; position:relative; }
  .hero-card.bn-card { grid-column:span 4; }
  .hero-card .label { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:4px; }
  .hero-card .value { font-size:24px; font-weight:700; }
  .hero-card .delta { font-size:12px; margin-top:4px; }
  .hero-card .delta.pos { color:var(--accent2); }
  .hero-card .delta.neg { color:var(--danger); }
  .hero-card .norm { font-size:10px; color:var(--muted); margin-top:4px; opacity:0.8; }
  .hero-card .norm strong { color:var(--text); }

  .hero-card.healthy { border-color:rgba(34,197,94,0.3); background:rgba(34,197,94,0.04); }
  .hero-card.warning { border-color:rgba(245,158,11,0.3); background:rgba(245,158,11,0.04); }
  .hero-card.danger { border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.04); }
  .hero-card.neutral { border-color:var(--border); background:var(--card); }

  .health-dot { position:absolute; top:10px; right:10px; width:6px; height:6px; border-radius:50%; }
  .health-dot.healthy { background:var(--accent2); box-shadow:0 0 6px rgba(34,197,94,0.5); }
  .health-dot.warning { background:var(--warn); box-shadow:0 0 6px rgba(245,158,11,0.5); }
  .health-dot.danger { background:var(--danger); box-shadow:0 0 6px rgba(239,68,68,0.5); }
  .health-dot.neutral { background:var(--muted); }

  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:16px; margin-bottom:24px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .panel h2 { font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:12px; }

  /* Compact ops-read panel */
  .ops-panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .ops-panel .ops-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .ops-panel .ops-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:12px; }
  .ops-panel .ops-badge.green { background:rgba(34,197,94,0.12); color:var(--accent2); }
  .ops-panel .ops-badge.yellow { background:rgba(245,158,11,0.12); color:var(--warn); }
  .ops-panel .ops-badge.red { background:rgba(239,68,68,0.12); color:var(--danger); }
  .ops-panel .ops-badge .dot { width:6px; height:6px; border-radius:50%; }
  .ops-panel .ops-badge.green .dot { background:var(--accent2); }
  .ops-panel .ops-badge.yellow .dot { background:var(--warn); }
  .ops-panel .ops-badge.red .dot { background:var(--danger); }
  .ops-panel h2 { font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin:0; }
  .ops-panel .ops-headline { font-size:13px; color:var(--text); line-height:1.5; margin-bottom:10px; }
  .ops-panel .ops-list { list-style:none; padding:0; margin:0 0 10px 0; }
  .ops-panel .ops-list li { font-size:12px; color:var(--muted); padding:3px 0 3px 14px; position:relative; line-height:1.5; }
  .ops-panel .ops-list li::before { content:"\2022"; position:absolute; left:0; color:var(--accent); }
  .ops-panel .ops-section-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin:10px 0 4px 0; }
  .ops-panel .ops-alert { background:rgba(245,158,11,0.08); border-left:3px solid var(--warn); padding:8px 12px; border-radius:0 4px 4px 0; margin-top:8px; }
  .ops-panel .ops-alert p { font-size:12px; color:var(--warn); margin:0; }

  /* Bottleneck funnel card */
  .bn-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; position:relative; }
  .bn-card.danger { border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.04); }
  .bn-card .bn-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .bn-card .bn-head .bn-label { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin:0; }
  .bn-card .bn-head .bn-title { font-size:12px; color:var(--text); font-weight:600; margin:0; }
  .bn-card .bn-head-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .bn-card .bn-worst-badge { font-size:13px; font-weight:700; color:var(--danger); white-space:nowrap; }
  .bn-card .bn-updated { font-size:10px; color:var(--muted); opacity:0.7; white-space:nowrap; }

  /* Funnel chart inside bottleneck card */
  .bn-card .bn-funnel-wrap { margin:10px 0 4px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .bn-card .bn-funnel { display:flex; align-items:flex-end; gap:3px; min-width:250px; }
  .bn-card .bn-stage { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
  .bn-card .bn-bar { width:100%; border-radius:4px 4px 0 0; min-height:4px; }
  .bn-card .bn-bar.healthy { background:rgba(34,197,94,0.4); }
  .bn-card .bn-bar.warning { background:rgba(245,158,11,0.5); }
  .bn-card .bn-bar.danger { background:rgba(239,68,68,0.6); }
  .bn-card .bn-bar.neutral { background:rgba(59,130,246,0.3); }
  .bn-card .bn-stage-val { font-size:9px; font-weight:600; color:var(--text); text-align:center; }
  .bn-card .bn-stage-name { font-size:8px; color:var(--muted); text-align:center; margin-top:2px; }
  .bn-card .bn-drop-label { font-size:7px; color:var(--danger); text-align:center; font-weight:700; }

  .bn-card .bn-diagnosis { font-size:11px; color:var(--muted); line-height:1.5; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
  .bn-card .bn-diagnosis strong { color:var(--text); }

  .chart-wrap { position:relative; height:260px; }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:520px; }
  th { text-align:left; padding:8px 10px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  .right { text-align:right; }

  .loading { text-align:center; padding:40px; color:var(--muted); }
  .error { text-align:center; padding:40px; color:var(--danger); }

  @media (max-width: 640px) {
    .container { padding:16px 12px; }
    header h1 { font-size:18px; }
    .hero { grid-template-columns:repeat(2, 1fr); gap:8px; }
    .hero-card.bn-card { grid-column:1 / -1; }
    .hero-card { padding:12px; }
    .hero-card .value { font-size:20px; }
    .hero-card .delta { font-size:11px; }
    .hero-card .norm { display:none; }
    .grid { grid-template-columns:1fr; gap:12px; }
    .panel { padding:12px; }
    .ops-panel { padding:12px; }
    .bn-card .bn-funnel { gap:2px; min-width:200px; }
    .bn-card .bn-stage-val { font-size:7px; }
    .bn-card .bn-stage-name { font-size:6px; }
    .bn-card .bn-drop-label { display:none; }
    .bn-card .bn-diagnosis { font-size:10px; }
    .chart-wrap { height:200px; }
    th, td { padding:6px 8px; font-size:12px; }
  }
</style>
</head>

<script>
let chartInstance = null;

function fmtCurrency(n) {
  if (n === undefined || n === null) return '\u2014';
  return '$' + Number(n).toFixed(2);
}
function fmtNumber(n) {
  if (n === undefined || n === null) return '\u2014';
  return Number(n).toLocaleString();
}
function fmtPct(n) {
  if (n === undefined || n === null) return '\u2014';
  return Number(n).toFixed(2) + '%';
}

async function loadData() {
  if (typeof AD_SPEND_DATA !== 'undefined') {
    return AD_SPEND_DATA;
  }
  const res = await fetch('/api/ad-spend');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function loadNotes() {
  if (typeof AD_SPEND_NOTES !== 'undefined') {
    return AD_SPEND_NOTES;
  }
  try {
    const res = await fetch('/api/ad-spend-notes');
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}

function healthClass(metric, value) {
  if (value === undefined || value === null || isNaN(value)) return 'neutral';
  switch (metric) {
    case 'ctr':
      if (value >= 2.0) return 'healthy';
      if (value >= 1.0) return 'warning';
      return 'danger';
    case 'cpc':
      if (value <= 0.40) return 'healthy';
      if (value <= 0.70) return 'warning';
      return 'danger';
    case 'cpm':
      if (value <= 8.0) return 'healthy';
      if (value <= 15.0) return 'warning';
      return 'danger';
    case 'conversions':
      if (value >= 5) return 'healthy';
      if (value >= 1) return 'warning';
      return 'danger';
    case 'roas':
      if (value >= 3.0) return 'healthy';
      if (value >= 1.5) return 'warning';
      return 'danger';
    default:
      return 'neutral';
  }
}

function normText(metric) {
  switch (metric) {
    case 'ctr': return 'Norm: 1-2% (prospecting)';
    case 'cpc': return 'Norm: $0.30-$0.80 (B2B svc)';
    case 'cpm': return 'Norm: $5-$15';
    case 'conversions': return 'Norm: 5+/mo (lead gen)';
    case 'roas': return 'Norm: 3x+ (break-even 1x)';
    default: return '';
  }
}

function renderOpsPanel(notes) {
  if (!notes) return '<div class="ops-panel"><h2>Ops Read</h2><p style="font-size:12px;color:var(--muted);">No notes available.</p></div>';
  const badgeClass = notes.status || 'green';
  const badgeLabel = notes.status_label || 'Healthy';
  const alertHtml = notes.alert ? `<div class="ops-alert"><p>${notes.alert}</p></div>` : '';
  const watchingList = (notes.watching || []).map(w => `<li>${w}</li>`).join('');
  const testsList = (notes.next_tests || []).map(t => `<li>${t}</li>`).join('');

  return `
  <div class="ops-panel">
    <div class="ops-header">
      <h2>Ops Read</h2>
      <span class="ops-badge ${badgeClass}"><span class="dot"></span> ${badgeLabel}</span>
    </div>
    <p class="ops-headline">${notes.headline || notes.current_read || 'No read available.'}</p>
    ${watchingList ? `<div class="ops-section-title">Watching</div><ul class="ops-list">${watchingList}</ul>` : ''}
    ${testsList ? `<div class="ops-section-title">Next Tests</div><ul class="ops-list">${testsList}</ul>` : ''}
    ${alertHtml}
  </div>
  `;
}

function renderBottleneckCard(notes) {
  const bn = notes?.bottleneck;
  if (!bn || !bn.stages || bn.stages.length < 2) return '';
  const worst = bn.worst_drop;
  const second = bn.second_worst;
  const diagnosis = bn.diagnosis || 'No diagnosis available.';
  const maxVal = Math.max(...bn.stages.map(s => s.value || 0));
  const worstFrom = worst?.from || '';
  const secondFrom = second?.from || '';

  const bars = bn.stages.map((s, i) => {
    // Use log10 scale so bars span multiple orders of magnitude visibly
    const logMax = Math.log10(Math.max(maxVal, 1));
    const logVal = Math.log10(Math.max(s.value, 1));
    const pct = logMax > 0 ? Math.max((logVal / logMax) * 100, 8) : 8;
    const barH = Math.max(pct * 0.95, 6);
    const isDanger = s.name === worstFrom || s.name === secondFrom;
    const dropInfo = bn.drops?.find(d => d.to === s.name);
    const dropLabel = dropInfo && dropInfo.rate < 50 ? `-${(100 - dropInfo.rate).toFixed(0)}%` : '';

    return `
      <div class="bn-stage">
        <div class="bn-bar ${isDanger ? 'danger' : pct > 50 ? 'neutral' : 'warning'}" style="height:${barH}px;"></div>
        <div class="bn-stage-val">${s.value === 0 ? '0' : s.value >= 1000 ? (s.value / 1000).toFixed(1) + 'K' : s.value}</div>
        <div class="bn-stage-name">${s.name}</div>
        ${dropLabel ? `<div class="bn-drop-label">${dropLabel}</div>` : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="hero-card bn-card ${worst ? 'danger' : 'neutral'}">
      <div class="bn-head">
        <div>
          <div class="bn-label">Bottleneck Analysis</div>
          <div class="bn-title">${bn.funnel_label || 'Funnel'}</div>
        </div>
        <div class="bn-head-right">
          <div class="bn-worst-badge">⚠ ${worst ? worst.label || 'Bottleneck' : 'No bottleneck'}</div>
          <div class="bn-updated">Updated ${bn.updated || ''}</div>
        </div>
      </div>
      <div class="bn-funnel-wrap">
        <div class="bn-funnel">${bars}</div>
      </div>
      <div class="bn-diagnosis">${diagnosis}</div>
    </div>
  `;
}

function render(data) {
  const meta = data.platforms?.meta || {};
  const summary = data.summary || {};
  const daily = meta.daily || [];
  const campaigns = meta.campaigns || [];
  const scopeLabel = meta.scope_label || 'Active campaigns only';
  const excludedSpend = Number(meta.excluded_paused_spend_30d || 0);
  const excludedCount = (meta.excluded_paused_campaigns_30d || []).length;

  const totalSpend = meta.total_spend_30d || 0;
  const avgDaily = daily.length > 0 ? totalSpend / daily.length : 0;
  const activeCampaigns = meta.active_campaigns || 0;
  const ctr = meta.ctr || 0;
  const cpc = meta.avg_cpc || 0;
  const cpm = meta.avg_cpm || 0;
  const conversions = meta.total_conversions_30d || 0;

  let roas = 0;
  const convValue = campaigns.reduce((s, c) => s + (c.conversions_value || 0), 0);
  if (convValue > 0 && totalSpend > 0) {
    roas = convValue / totalSpend;
  } else if (conversions > 0) {
    roas = (conversions * 200) / totalSpend;
  }

  const lastDate = daily.length > 0 ? daily[daily.length - 1].date : '\u2014';
  const lastSpend = daily.length > 0 ? daily[daily.length - 1].spend : 0;

  const ctrHealth = healthClass('ctr', ctr);
  const cpcHealth = healthClass('cpc', cpc);
  const cpmHealth = healthClass('cpm', cpm);
  const convHealth = healthClass('conversions', conversions);
  const roasHealth = healthClass('roas', roas);

  const opsHtml = window._opsNotesHtml || '';
  const bnHtml = window._bottleneckHtml || '';

  let html = `
  <div class="hero">
    <div class="hero-card neutral">
      <div class="label">30-Day Spend</div>
      <div class="value">${fmtCurrency(totalSpend)}</div>
      <div class="delta">${scopeLabel}</div>
      <div class="norm">Excluded paused: ${fmtCurrency(excludedSpend)}${excludedCount ? ` across ${excludedCount} campaign${excludedCount === 1 ? '' : 's'}` : ''}</div>
    </div>
    <div class="hero-card neutral">
      <div class="label">Daily Avg</div>
      <div class="value">${fmtCurrency(avgDaily)}</div>
      <div class="delta">${daily.length} active-campaign days tracked</div>
    </div>
    <div class="hero-card neutral">
      <div class="label">Active Campaigns</div>
      <div class="value">${activeCampaigns}</div>
      <div class="delta">Meta Ads</div>
    </div>
    <div class="hero-card ${ctrHealth}">
      <div class="health-dot ${ctrHealth}"></div>
      <div class="label">CTR</div>
      <div class="value">${fmtPct(ctr)}</div>
      <div class="delta">${fmtNumber(meta.total_clicks_30d)} clicks</div>
      <div class="norm">${normText('ctr')}</div>
    </div>
    <div class="hero-card ${cpcHealth}">
      <div class="health-dot ${cpcHealth}"></div>
      <div class="label">Avg CPC</div>
      <div class="value">${fmtCurrency(cpc)}</div>
      <div class="delta">${fmtCurrency(meta.avg_cpm || 0)} CPM</div>
      <div class="norm">${normText('cpc')}</div>
    </div>
    <div class="hero-card ${cpmHealth}">
      <div class="health-dot ${cpmHealth}"></div>
      <div class="label">CPM</div>
      <div class="value">${fmtCurrency(cpm)}</div>
      <div class="delta">${fmtNumber(meta.total_impressions_30d)} impressions</div>
      <div class="norm">${normText('cpm')}</div>
    </div>
    <div class="hero-card ${convHealth}">
      <div class="health-dot ${convHealth}"></div>
      <div class="label">Conversions</div>
      <div class="value">${fmtNumber(conversions)}</div>
      <div class="delta">${conversions === 0 ? 'None recorded' : 'Last 30 days'}</div>
      <div class="norm">${normText('conversions')}</div>
    </div>
    <div class="hero-card ${roasHealth}">
      <div class="health-dot ${roasHealth}"></div>
      <div class="label">Est. ROAS</div>
      <div class="value">${roas > 0 ? roas.toFixed(1) + 'x' : '\u2014'}</div>
      <div class="delta">${roas > 0 ? 'Estimated from spend' : 'No conv. data yet'}</div>
      <div class="norm">${normText('roas')}</div>
    </div>
    ${bnHtml}
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Daily Spend Trend (30 Days)</h2>
      <div class="chart-wrap">
        <canvas id="spendChart"></canvas>
      </div>
    </div>
    ${opsHtml}
  </div>

  <div class="panel">
    <h2>Active Campaigns (Last 30 Days)</h2>
    <div style="font-size:12px;color:var(--muted);margin:-4px 0 10px 0;">Spend, clicks, impressions, and conversions below are filtered to campaigns currently ACTIVE in Meta. Paused/inactive campaign spend excluded: ${fmtCurrency(excludedSpend)}.</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Campaign</th>
            <th class="right">Spend</th>
            <th class="right">Clicks</th>
            <th class="right">Impressions</th>
            <th class="right">Conv.</th>
          </tr>
        </thead>
        <tbody>
          ${campaigns.map(c => `
          <tr>
            <td>${c.name}</td>
            <td class="right">${fmtCurrency(c.spend)}</td>
            <td class="right">${fmtNumber(c.clicks)}</td>
            <td class="right">${fmtNumber(c.impressions)}</td>
            <td class="right">${fmtNumber(c.conversions)}</td>
          </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  </div>
  `;

  document.getElementById('content').innerHTML = html;
  document.getElementById('last-updated').textContent = 'Updated: ' + new Date(data.collected_at).toLocaleString('en-US', { timeZone: 'America/New_York' }) + ' EST';

  const ctx = document.getElementById('spendChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  const labels = daily.map(d => d.date.slice(5));
  const spendData = daily.map(d => d.spend);
  const clickData = daily.map(d => d.clicks);

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Spend ($)',
          data: spendData,
          backgroundColor: 'rgba(59, 130, 246, 0.6)',
          borderColor: 'rgba(59, 130, 246, 1)',
          borderWidth: 1,
          yAxisID: 'y',
        },
        {
          label: 'Clicks',
          data: clickData,
          type: 'line',
          borderColor: 'rgba(34, 197, 94, 0.8)',
          backgroundColor: 'rgba(34, 197, 94, 0.1)',
          borderWidth: 2,
          pointRadius: 2,
          yAxisID: 'y1',
          tension: 0.3,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#c8cdd9', font: { size: 11 } } },
        tooltip: {
          backgroundColor: '#12141d',
          titleColor: '#c8cdd9',
          bodyColor: '#c8cdd9',
          borderColor: '#1e2030',
          borderWidth: 1,
        }
      },
      scales: {
        x: {
          ticks: { color: '#6b7280', font: { size: 10 }, maxRotation: 45 },
          grid: { color: '#1e2030' }
        },
        y: {
          type: 'linear',
          display: true,
          position: 'left',
          ticks: { color: '#6b7280', font: { size: 10 }, callback: v => '$' + v },
          grid: { color: '#1e2030' },
          title: { display: true, text: 'Spend', color: '#6b7280', font: { size: 10 } }
        },
        y1: {
          type: 'linear',
          display: true,
          position: 'right',
          ticks: { color: '#6b7280', font: { size: 10 } },
          grid: { drawOnChartArea: false },
          title: { display: true, text: 'Clicks', color: '#6b7280', font: { size: 10 } }
        }
      }
    }
  });
}

async function refreshData() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = 'Refreshing...';
  try {
    const data = await loadData();
    const notes = await loadNotes();
    window._opsNotesHtml = renderOpsPanel(notes);
    window._bottleneckHtml = renderBottleneckCard(notes);
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

async function init() {
  try {
    const data = await loadData();
    const notes = await loadNotes();
    window._opsNotesHtml = renderOpsPanel(notes);
    window._bottleneckHtml = renderBottleneckCard(notes);
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">Error loading data: ${e.message}</div>`;
  }
}

init();
setInterval(init, 300000);
</script>
